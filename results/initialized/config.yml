concurrency: 1
data_granularity: 5min
end_time: '14:54'
exchange:
  deal_price:
  - $close
  - $close
  limit_threshold: null
  volume_threshold: null
order_file: ./data/orders/test_orders.pkl
output_dir: results/initialized
qlib:
  provider_uri_5min: ./data/bin/
start_time: '9:30'
strategies:
  1day:
    class: SAOEIntStrategy
    kwargs:
      action_interpreter:
        class: CategoricalActionInterpreter
        kwargs:
          max_step: 8
          values: 4
        module_path: qlib.rl.order_execution.interpreter
      data_granularity: 5
      network:
        class: Recurrent
        kwargs: {}
        module_path: qlib.rl.order_execution.network
      policy:
        class: PPO
        kwargs:
          lr: 0.0001
          weight_file: models/000.pth
        module_path: qlib.rl.order_execution.policy
      state_interpreter:
        class: FullHistoryStateInterpreter
        kwargs:
          data_dim: 5
          data_ticks: 48
          max_step: 8
          processed_data_provider:
            class: HandlerProcessedDataProvider
            kwargs:
              data_dir: ./data/pickle/
              feature_columns_today:
              - $high
              - $low
              - $open
              - $close
              - $volume
              feature_columns_yesterday:
              - $high_1
              - $low_1
              - $open_1
              - $close_1
              - $volume_1
            module_path: qlib.rl.data.native
        module_path: qlib.rl.order_execution.interpreter
    module_path: qlib.rl.order_execution.strategy
  30min:
    class: TWAPStrategy
    kwargs: {}
    module_path: qlib.contrib.strategy.rule_strategy
