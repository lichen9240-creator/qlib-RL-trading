# Three independent switches. Reuse the SAME frozen high checkpoint and HMM
# normalization artifact for every ablation; retrain only the low-level PPO.
high_level:
  config: /root/autodl-tmp/qlib-work/configs/train_ppo_preview.yml
  checkpoint: /root/autodl-tmp/qlib-work/results/ppo_preview/checkpoints/best_validation.pth
data:
  parquet_root: /root/autodl-tmp/qlib-work/qlib/examples/rl_order_execution/data/parquet
  orders: /root/autodl-tmp/qlib-work/qlib/examples/rl_order_execution/data/orders_preview
  start_index: 0
  end_index: 47
  train_end: '2021-06-30'
# Each 5-minute fill contributes its signed improvement over the arrival price, in bp of the parent order.
base_reward: arrival_bps
regime:
  enabled: true
  n_states: 3
  transition_prior: 1.0
  sticky_prior: 2.0
  variance_floor: 0.001
  max_iter: 40
  tol: 0.00001
  max_sequences: 2000
  model_path: /root/autodl-tmp/qlib-work/artifacts/regime_v1.npz
residual:
  enabled: true
  scale: 1.0
  values: [-1.0, -0.5, 0.0, 0.5, 1.0]
  window: 12
  hidden_dim: 64
  private_dim: 32
shaping:
  enabled: true
  coefficient: 0.1
ppo:
  lr: 0.0001
  discount_factor: 1.0
  gae_lambda: 0.95
  eps_clip: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  # Five nearly equiprobable training actions; a fresh greedy policy follows the reference schedule.
  initial_zero_bias: 0.01
runtime:
  seed: 42
  device: cuda
  concurrency: 8
  torch_threads: 2
  parallel_mode: subproc
  worker_threads: 1
  worker_timeout: 120
  file_cache_size: 256
  day_cache_size: 4096
  regime_cache_size: 4096
  # Execution-only switches; 1 / false restore the earlier inference paths.
  high_batch_size: 8
  high_batch_wait_ms: 0.5
  gru_sequence: true
  profile_execution: false
training:
  iterations: 100
  episodes_per_collect: 256
  buffer_size: 131072
  batch_size: 512
  repeat: 5
  validate_every: 2
  train_limit: null
  valid_limit: 1024
  test_limit: 1024
output: /root/autodl-tmp/qlib-work/results/residual_full
